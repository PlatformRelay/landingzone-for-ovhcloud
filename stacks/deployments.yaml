# Deployment manifest of the sandbox account (005 T039; data-model.md, FR-006, FR-007).
# YAML in its JSON-compatible flow form, decoded strictly; whole-line comments only.
# Edit a row, then run `task stacks:reconcile` and `task stacks:generate` and commit the result.
# Project ids are never written here: each project ref resolves to LZ_PROJECT_ID_<REF> in the
# bound account file (~/.config/ovh-lz/accounts/<account>/account.env).
{
  "apiVersion": "lz.platformrelay.dev/v1alpha1",
  "kind": "Deployments",
  "metadata": {"name": "sandbox"},
  "spec": {
    "scope": "platform",
    # naming discriminator (D87); bucket names are global, override if taken (P21, T010)
    "org": "lz",
    "forge": "github.com/platformrelay/landingzone-for-ovhcloud",
    "stage_source": {"kind": "local"},
    # KD-1 (spec.md Known deviations, D88): the sandbox account has one Public Cloud project, so the
    # state buckets share it with demo/dev; STATE and DEMO_DEV resolve to the same project id.
    "sandbox": {"shared_state_project": true},
    "state": {
      "project": {"ref": "STATE"},
      "region": "gra",
      "endpoint": "https://s3.gra.io.cloud.ovh.net"
    },
    "tenants": [
      {
        "name": "demo",
        "environments": [
          {
            "name": "dev",
            # T009 (D94): P5 refuted (adopting the existing project plans a replacement), so the
            # sandbox project is referenced, not adopted (research R7).
            "project": {"mode": "reference", "ref": "DEMO_DEV"},
            "regions": [
              {"name": "GRA11", "network": {"cidr": "10.20.0.0/24", "vlan_id": 0}}
            ],
            "budget_alert": {"enabled": false},
            "quota_guard": {"enabled": false}
          }
        ]
      }
    ],
    "instances": [
      {"id": "account-bootstrap", "stage": "bootstrap"},
      {"id": "account-governance", "stage": "account-governance"},
      {"id": "demo-state", "stage": "tenant-state", "tenant": "demo"},
      {"id": "demo-dev-project", "stage": "project", "tenant": "demo", "environment": "dev"},
      {"id": "demo-dev-gra11-network", "stage": "project-network", "tenant": "demo", "environment": "dev", "region": "GRA11"},
      {"id": "demo-dev-gra11-runtime", "stage": "runtime", "tenant": "demo", "environment": "dev", "region": "GRA11"}
    ]
  }
}
