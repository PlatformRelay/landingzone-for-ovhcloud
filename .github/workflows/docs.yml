# The documentation site (https://platformrelay.github.io/landingzone-for-ovhcloud/): a strict
# MkDocs build of docs/ on every pull request that touches it, and a deploy to GitHub Pages from
# main. It is not part of the foundation check; `task docs:check` stays the judge of the pages.
#
# The build tools come from the hash-locked docs/requirements.txt, wheels only. Every action is
# pinned by full commit SHA (ADR-0021); Renovate's default managers see these pins, but
# `task test:update-lane` does not judge them. Only the deploy job may write to Pages, and only
# from main.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "overrides/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "overrides/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions: {}

# A pull request's build never cancels a deploy from main.
concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the pinned build tools
        run: "python -m pip install --require-hashes --only-binary=:all: -r docs/requirements.txt"

      - name: Test the link hook
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s overrides/hooks -p 'test_*.py'

      - name: Build with every warning as an error
        run: mkdocs build --strict

      # Only a run that can deploy uploads the site; a pull request's build is the check.
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
