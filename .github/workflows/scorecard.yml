# OpenSSF Scorecard: scores the repository's supply-chain practices, publishes the result to the
# OpenSSF API (the README badge reads it) and uploads the findings to code scanning. It is not
# part of the foundation check and gates nothing.
#
# Every action is pinned by full commit SHA (ADR-0021); Renovate's default managers see these pins,
# but `task test:update-lane` does not judge them.
#
# Accepted exception to ADR-0021 (its 2026-11-02 amendment, under "Supply chain and evidence
# integrity"): the pinned ossf/scorecard-action commit runs the container image
# ghcr.io/ossf/scorecard-action:v2.5.0 by tag, not by digest, so that image can change under an
# unchanged pin. Calling the image by digest directly would replace the action, and the
# publish_results workflow restrictions (ossf/scorecard-action README) list the action by name.
# The job holds no repository secret: its token can read contents and write code-scanning
# results, and its OIDC token is what publishes the score.
name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "22 5 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload the SARIF to code scanning
      id-token: write # publish the result to the OpenSSF API (OIDC, no stored token)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload the SARIF to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
          category: scorecard
