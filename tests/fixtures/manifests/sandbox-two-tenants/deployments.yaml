# Two-tenant sandbox fixture (007 T017, FR-009; data-model *Two-tenant sandbox fixture*): the
# sandbox manifest (stacks/deployments.yaml) plus tenant lab on its own ref, offline only (B5).
# YAML in its JSON-compatible flow form; whole-line comments only.
{
  "apiVersion": "lz.platformrelay.dev/v1alpha1",
  "kind": "Deployments",
  "metadata": {"name": "sandbox"},
  "spec": {
    "scope": "platform",
    "org": "lz",
    "forge": "github.com/platformrelay/landingzone-for-ovhcloud",
    "stage_source": {"kind": "local"},
    # KD-1 (D88): the state buckets share demo/dev's project. It admits STATE beside DEMO_DEV only;
    # LAB_DEV on that project is refused (FR-003, A17).
    "sandbox": {"shared_state_project": true},
    "state": {
      "project": {"ref": "STATE"},
      "region": "gra",
      "endpoint": "https://s3.gra.io.cloud.ovh.net"
    },
    "tenants": [
      {
        "name": "demo",
        "environments": [
          {
            "name": "dev",
            "project": {"mode": "reference", "ref": "DEMO_DEV"},
            "regions": [
              {"name": "GRA11", "network": {"cidr": "10.20.0.0/24", "vlan_id": 0}}
            ],
            "budget_alert": {"enabled": false},
            "quota_guard": {"enabled": false}
          }
        ]
      },
      {
        "name": "lab",
        "environments": [
          {
            "name": "dev",
            "project": {"mode": "reference", "ref": "LAB_DEV"},
            "regions": [
              {"name": "GRA11", "network": {"cidr": "10.40.0.0/24", "vlan_id": 0}}
            ],
            "budget_alert": {"enabled": false},
            "quota_guard": {"enabled": false}
          }
        ]
      }
    ],
    "instances": [
      {"id": "account-bootstrap", "stage": "bootstrap"},
      {"id": "account-governance", "stage": "account-governance"},
      {"id": "demo-state", "stage": "tenant-state", "tenant": "demo"},
      {"id": "demo-dev-project", "stage": "project", "tenant": "demo", "environment": "dev"},
      {"id": "demo-dev-gra11-network", "stage": "project-network", "tenant": "demo", "environment": "dev", "region": "GRA11"},
      {"id": "demo-dev-gra11-runtime", "stage": "runtime", "tenant": "demo", "environment": "dev", "region": "GRA11"},
      {"id": "lab-state", "stage": "tenant-state", "tenant": "lab"},
      {"id": "lab-dev-project", "stage": "project", "tenant": "lab", "environment": "dev"},
      {"id": "lab-dev-gra11-network", "stage": "project-network", "tenant": "lab", "environment": "dev", "region": "GRA11"},
      {"id": "lab-dev-gra11-runtime", "stage": "runtime", "tenant": "lab", "environment": "dev", "region": "GRA11"}
    ]
  }
}
