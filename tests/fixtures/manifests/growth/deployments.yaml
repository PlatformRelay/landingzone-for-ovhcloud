# Growth manifest fixture (005 T033, SC-002): two tenants x two environments x two regions, and
# two runtime slots (blue, green) in demo/dev/GRA11. spec.scope is absent: platform is the default.
{
  "apiVersion": "lz.platformrelay.dev/v1alpha1",
  "kind": "Deployments",
  "metadata": {"name": "growth"},
  "spec": {
    "org": "lz",
    "forge": "example.org/platformrelay/landingzone-for-ovhcloud",
    "stage_source": {"kind": "local"},
    "state": {
      "project": {"ref": "STATE"},
      "region": "gra",
      "endpoint": "https://s3.gra.io.cloud.ovh.net"
    },
    "tenants": [
      {
        "name": "demo",
        "environments": [
          {
            "name": "dev",
            "project": {"mode": "adopt", "ref": "DEMO_DEV"},
            "regions": [
              {"name": "GRA11", "network": {"cidr": "10.20.0.0/24", "vlan_id": 0}},
              {"name": "SBG5", "network": {"cidr": "10.20.1.0/24", "vlan_id": 0}}
            ]
          },
          {
            "name": "prod",
            "project": {"mode": "reference", "ref": "DEMO_PROD"},
            "regions": [
              {"name": "GRA11", "network": {"cidr": "10.21.0.0/24", "vlan_id": 0}},
              {"name": "SBG5", "network": {"cidr": "10.21.1.0/24", "vlan_id": 0}}
            ]
          }
        ]
      },
      {
        "name": "shop",
        "environments": [
          {
            "name": "dev",
            "project": {"mode": "adopt", "ref": "SHOP_DEV"},
            "regions": [
              {"name": "GRA11", "network": {"cidr": "10.30.0.0/24", "vlan_id": 0}},
              {"name": "SBG5", "network": {"cidr": "10.30.1.0/24", "vlan_id": 0}}
            ]
          },
          {
            "name": "prod",
            "project": {"mode": "adopt", "ref": "SHOP_PROD"},
            "regions": [
              {"name": "GRA11", "network": {"cidr": "10.31.0.0/24", "vlan_id": 0}},
              {"name": "SBG5", "network": {"cidr": "10.31.1.0/24", "vlan_id": 0}}
            ]
          }
        ]
      }
    ],
    "instances": [
      {"id": "account-bootstrap", "stage": "bootstrap"},
      {"id": "account-governance", "stage": "account-governance"},
      {"id": "demo-state", "stage": "tenant-state", "tenant": "demo"},
      {"id": "shop-state", "stage": "tenant-state", "tenant": "shop"},
      {"id": "demo-dev-project", "stage": "project", "tenant": "demo", "environment": "dev"},
      {"id": "demo-prod-project", "stage": "project", "tenant": "demo", "environment": "prod"},
      {"id": "shop-dev-project", "stage": "project", "tenant": "shop", "environment": "dev"},
      {"id": "shop-prod-project", "stage": "project", "tenant": "shop", "environment": "prod"},
      {"id": "demo-dev-gra11-network", "stage": "project-network", "tenant": "demo", "environment": "dev", "region": "GRA11"},
      {"id": "demo-dev-sbg5-network", "stage": "project-network", "tenant": "demo", "environment": "dev", "region": "SBG5"},
      {"id": "demo-prod-gra11-network", "stage": "project-network", "tenant": "demo", "environment": "prod", "region": "GRA11"},
      {"id": "demo-prod-sbg5-network", "stage": "project-network", "tenant": "demo", "environment": "prod", "region": "SBG5"},
      {"id": "shop-dev-gra11-network", "stage": "project-network", "tenant": "shop", "environment": "dev", "region": "GRA11"},
      {"id": "shop-dev-sbg5-network", "stage": "project-network", "tenant": "shop", "environment": "dev", "region": "SBG5"},
      {"id": "shop-prod-gra11-network", "stage": "project-network", "tenant": "shop", "environment": "prod", "region": "GRA11"},
      {"id": "shop-prod-sbg5-network", "stage": "project-network", "tenant": "shop", "environment": "prod", "region": "SBG5"},
      {"id": "demo-dev-gra11-runtime-blue", "stage": "runtime", "tenant": "demo", "environment": "dev", "region": "GRA11", "slot": "blue"},
      {"id": "demo-dev-gra11-runtime-green", "stage": "runtime", "tenant": "demo", "environment": "dev", "region": "GRA11", "slot": "green"},
      {"id": "demo-dev-sbg5-runtime", "stage": "runtime", "tenant": "demo", "environment": "dev", "region": "SBG5"},
      {"id": "demo-prod-gra11-runtime", "stage": "runtime", "tenant": "demo", "environment": "prod", "region": "GRA11"},
      {"id": "demo-prod-sbg5-runtime", "stage": "runtime", "tenant": "demo", "environment": "prod", "region": "SBG5"},
      {"id": "shop-dev-gra11-runtime", "stage": "runtime", "tenant": "shop", "environment": "dev", "region": "GRA11"},
      {"id": "shop-dev-sbg5-runtime", "stage": "runtime", "tenant": "shop", "environment": "dev", "region": "SBG5"},
      {"id": "shop-prod-gra11-runtime", "stage": "runtime", "tenant": "shop", "environment": "prod", "region": "GRA11"},
      {"id": "shop-prod-sbg5-runtime", "stage": "runtime", "tenant": "shop", "environment": "prod", "region": "SBG5"}
    ]
  }
}
