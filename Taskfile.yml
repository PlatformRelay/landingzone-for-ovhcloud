# Run every target through the installed entry:
#   lz-offline --candidate <absolute-checkout> -- task <target>
# verify:toolchain and test:offline-boundary are run by the entry's own trusted
# code; definitions for them here are never consulted, so a candidate cannot
# turn a qualification into a no-op.
version: '3'
silent: true

tasks:
  test:reports:
    desc: Report adapter, schema and JUnit view against the captured tofu streams (V002)
    cmds:
      - go -C tools test -count=1 ./internal/report ./cmd/json2junit

  test:traceability:
    desc: Trace rules, check registry and DoD evaluator (V003)
    cmds:
      - go -C tools test -count=1 ./internal/checks ./cmd/lz-check

  test:dependencies:
    desc: Layer, reference and changed-closure rules on their fixtures, then this repository's own module graph (V006)
    cmds:
      - go -C tools test -count=1 -run 'TestDependenc' ./internal/checks ./cmd/lz-check
      - go -C tools run ./cmd/lz-check -root .. deps

  test:runtime-image:
    desc: Reproducible OCI packing of the runtime bundle and launcher, and its refusals (V009)
    cmds:
      - go -C tools test -count=1 ./cmd/lz-pack ./internal/bundle/...

  test:foundation-ci:
    desc: Foundation CI source, rendered workflow and their refusals, then this repository's own (V009)
    cmds:
      - go -C tools test -count=1 -run 'TestFoundation|TestTraceabilityParse' ./internal/checks ./cmd/lz-check
      - go -C tools run ./cmd/lz-check -root .. ci-source specs/001-offline-foundation specs/005-first-landing-zone-slice

  # Judges recorded run evidence, so the workflow defers it: it cannot judge
  # its own run. The record is built on the host from read-only gh captures
  # with `lz-check ci-observe`; see specs/001-offline-foundation/evidence/T023.md.
  # Judge a clean checkout: the head runs are bound to the target digests of
  # the files on disk, so an untracked file in a target's scope reads as stale.
  ci:foundation:
    desc: Recorded GitHub runs of the foundation workflow against its approved source; green head and red control (V009)
    cmds:
      - go -C tools run ./cmd/lz-check -root .. ci-runs

  # Host-side: the offline entry mounts the candidate read-only. Writes the
  # workflow rendered from pipelines/github/foundation-source.json.
  generate:foundation-ci:
    desc: Render .github/workflows/foundation.yml from its approved source
    cmds:
      - go -C tools run ./cmd/lz-check -root .. ci-workflow > .github/workflows/foundation.yml

  test:static:
    desc: Real pinned fmt, init, validate and TFLint clauses on valid and broken fixtures (V006)
    cmds:
      - go -C tools test -count=1 -tags offlinetools -run 'TestStatic|TestLint' ./internal/checks ./cmd/lz-check

  lint:
    desc: 'Pinned fmt, init, validate and TFLint on one module directory, e.g. task lint -- modules/naming (V006)'
    cmds:
      - go -C tools run ./cmd/lz-check -root .. lint {{.CLI_ARGS}}

  test:unit:
    desc: 'Mirror-only init, then tofu test -json through the report adapter on one directory, e.g. task test:unit -- modules/naming (005 V001)'
    cmds:
      - go -C tools run ./cmd/lz-check -root .. unit {{.CLI_ARGS}}

  # Fails on zero discovery until the first library exists (005 T012); that
  # red is the expected result, never a pass.
  test:slice:
    desc: Unit and slice runner controls on their fixtures, then lint and test:unit on every library and stage directory of the module graph (005 V002)
    cmds:
      - go -C tools test -count=1 -tags offlinetools -run 'TestUnit' ./internal/checks ./cmd/lz-check
      - go -C tools run ./cmd/lz-check -root .. slice

  # Output-contract controls (005 T017, T018): the envelope builder on the
  # captured `tofu output -json`, the per-stage fixture envelopes and their
  # refusals, and schemas/outputs/ agreeing with the validator's Go types.
  test:outputs:
    desc: Envelope builder and outputs.json validator against captured tofu output and fixture envelopes, and schemas/outputs agreeing with the validator types (005 V004)
    cmds:
      - go -C tools test -count=1 -run 'TestOutputs' ./internal/stacks

  # Stack-model controls (005 T034, extended by T036, T038, T041): every test of
  # ./internal/stacks except the output contract (test:outputs) — manifest
  # decoding and refusals, schemas/deployments.schema.json agreeing with the
  # decoder's types and value rules, the stage table agreeing with data-model.md.
  test:stacks:
    desc: Deployment manifest decoder, schema/type agreement and stage table against data-model.md (005 V005)
    cmds:
      - go -C tools test -count=1 -skip '^TestOutputs' ./internal/stacks

  # The live lane's offline controls: fakes only, no credential, no API call.
  # The host guard, child environment, account binding and credential files
  # (T053), the run core, redaction, leftover check and `lz-live probe`
  # (T055); later verbs (T059, T047, T062) extend it.
  test:live-lane:
    desc: Live-lane safety core and lz-live entry against fake git, fake API and fake children (005 V007)
    cmds:
      - go -C tools test -count=1 ./internal/live ./cmd/lz-live
      - go -C tools run ./cmd/lz-check -root .. unit tests/live/probes/alerting
      - go -C tools run ./cmd/lz-check -root .. unit tests/live/probes/iam
      - go -C tools run ./cmd/lz-check -root .. unit tests/live/probes/network
      - go -C tools run ./cmd/lz-check -root .. unit tests/live/probes/quota
      - go -C tools run ./cmd/lz-check -root .. unit tests/live/probes/state-backend
      - go -C tools run ./cmd/lz-check -root .. unit tests/live/probes/storage-iam
      - go -C tools run ./cmd/lz-check -root .. unit tests/live/probes/storage-iam/companion

  # Host target: the owner on the maintainer host only, never inside lz-offline
  # and never run by an agent (it loads ~/.config/ovh-lz/ credentials and calls
  # the OVHcloud API). lz-live is built from this checkout and runs from its
  # root, where the host guard expects it, e.g.
  #   task live:probe -- --reviewed-sha <sha> tests/live/probes/<probe> [--plan-only]
  #   task live:probe -- --reviewed-sha <sha> --cleanup <run-id>
  live:probe:
    desc: Run one probe root through the live run core, or resume its cleanup (host, owner; 005 R12)
    cmds:
      - go -C tools build -o ../.local/bin/lz-live ./cmd/lz-live
      - .local/bin/lz-live probe {{.CLI_ARGS}}

  check:specs:
    desc: 'Trace a spec''s requirements and tasks through its keys in harness/checks.yaml, e.g. task check:specs -- specs/005-first-landing-zone-slice; without arguments specs 001 and 005 (V003, 005 V011)'
    vars:
      SPEC_DIRS: '{{.CLI_ARGS | default "specs/001-offline-foundation specs/005-first-landing-zone-slice"}}'
    cmds:
      - for: {var: SPEC_DIRS}
        cmd: go -C tools run ./cmd/lz-check -root .. specs "{{.ITEM}}"

  dod:
    desc: 'Definition of done for a path, e.g. task dod -- modules/naming (V003)'
    cmds:
      - go -C tools run ./cmd/lz-check -root .. dod {{.CLI_ARGS}}

  # One target per report fixture case; tests/fixtures/tofu/capture.sh records
  # their stdout. Each prints exactly the pinned `tofu test -json` stream.
  capture:tofu-pass:
    cmds: [{task: capture-tofu, vars: {CASE: pass}}]
  capture:tofu-fail:
    cmds: [{task: capture-tofu, vars: {CASE: fail}}]
  capture:tofu-zero:
    cmds: [{task: capture-tofu, vars: {CASE: zero}}]
  capture:tofu-skip:
    cmds: [{task: capture-tofu, vars: {CASE: skip}}]
  capture:tofu-cleanup:
    cmds: [{task: capture-tofu, vars: {CASE: cleanup}}]

  # Report captures of the static clauses: stdout is exactly the pinned tool's
  # JSON report; stderr ends with the tool's exit status.
  capture:validate-valid:
    cmds: [{task: capture-validate, vars: {CASE: valid}}]
  capture:validate-malformed:
    cmds: [{task: capture-validate, vars: {CASE: malformed}}]
  capture:tflint-valid:
    cmds: [{task: capture-tflint, vars: {CASE: valid}}]
  capture:tflint-lint:
    cmds: [{task: capture-tflint, vars: {CASE: lint}}]
  capture:tflint-malformed:
    cmds: [{task: capture-tflint, vars: {CASE: malformed}}]

  # Premise captures (005 T007); tests/fixtures/tofu-probes/capture.sh records their stdout.
  # JSON captures print exactly the pinned tool's document; transcripts mark each step with
  # `### <command>` and its exit with `LZ_EXIT=<status>`. State and scratch trees stay in /tmp.
  capture:p4-encryption:
    dir: tests/fixtures/tofu-probes/p4-encryption
    env:
      TF_VAR_state_path: /tmp/lz-p4/state/terraform.tfstate
      TF_VAR_passphrase: p4-fixture-passphrase-not-a-secret
    cmds:
      - |
        echo '### tofu version'
        /tcb/tofu version
        mkdir -p /tmp/lz-p4/state
        echo '### tofu init -input=false -no-color (TF_VAR_state_path, TF_VAR_passphrase)'
        status=0; /tcb/tofu init -input=false -no-color 2>&1 || status=$?; echo "LZ_EXIT=$status"
        echo '### tofu apply -auto-approve -input=false -no-color'
        status=0; /tcb/tofu apply -auto-approve -input=false -no-color 2>&1 || status=$?; echo "LZ_EXIT=$status"
        echo '### state files in the root directory (.terraform/terraform.tfstate is the backend cache)'
        find . -name '*.tfstate*' | sort
        echo '### backend cache holding the variable-derived state path'
        echo "state_path=$(grep -c -F '/tmp/lz-p4/state/terraform.tfstate' .terraform/terraform.tfstate)"
        echo '### files holding the passphrase (root directory and state directory)'
        grep -r -l -F "$TF_VAR_passphrase" . /tmp/lz-p4 | sort
        echo "passphrase_files=$(grep -r -l -F "$TF_VAR_passphrase" . /tmp/lz-p4 | wc -l)"
        echo '### state file at TF_VAR_state_path'
        status=0; test -f /tmp/lz-p4/state/terraform.tfstate || status=$?; echo "LZ_EXIT=$status"
        echo '### state file keys holding plaintext resources / an encryption envelope'
        echo "resources=$(grep -c '"resources"' /tmp/lz-p4/state/terraform.tfstate)"
        echo "encrypted_data=$(grep -c '"encrypted_data"' /tmp/lz-p4/state/terraform.tfstate)"
        echo '### tofu plan -input=false -no-color (wrong TF_VAR_passphrase)'
        status=0; TF_VAR_passphrase=wrong-passphrase-for-the-p4-fixture /tcb/tofu plan -input=false -no-color 2>&1 || status=$?; echo "LZ_EXIT=$status"
        echo '### tofu plan -input=false -no-color -detailed-exitcode (right TF_VAR_passphrase)'
        status=0; /tcb/tofu plan -input=false -no-color -detailed-exitcode 2>&1 || status=$?; echo "LZ_EXIT=$status"

  capture:p6-import:
    dir: tests/fixtures/tofu-probes/p6-import
    cmds:
      - /tcb/tofu init -input=false -no-color > /dev/null
      - /tcb/tofu plan -input=false -no-color -out=/tmp/lz-p6.plan > /dev/null
      - /tcb/tofu show -json /tmp/lz-p6.plan

  capture:p6-import-test:
    dir: tests/fixtures/tofu-probes/p6-import
    cmds:
      - |
        echo '### tofu version'
        /tcb/tofu version
        /tcb/tofu init -input=false -no-color > /dev/null
        echo '### tofu test -no-color'
        status=0; /tcb/tofu test -no-color 2>&1 || status=$?; echo "LZ_EXIT=$status"

  capture:p6-import-mock:
    dir: tests/fixtures/tofu-probes/p6-import-mock
    cmds:
      - |
        echo '### tofu version'
        /tcb/tofu version
        /tcb/tofu init -input=false -no-color > /dev/null
        echo '### tofu test -no-color -filter=apply.tftest.hcl'
        status=0; /tcb/tofu test -no-color -filter=apply.tftest.hcl 2>&1 || status=$?; echo "LZ_EXIT=$status"
        echo '### tofu test -no-color -filter=plan.tftest.hcl'
        status=0; /tcb/tofu test -no-color -filter=plan.tftest.hcl 2>&1 || status=$?; echo "LZ_EXIT=$status"

  capture:p16-ignore-changes:
    dir: tests/fixtures/tofu-probes/p16-ignore-changes
    cmds:
      - /tcb/tofu init -input=false -no-color > /dev/null
      - /tcb/tofu test -json

  # Output-contract root (005 T017); tests/fixtures/outputs/capture.sh records its stdout, the
  # pinned `tofu output -json` document. State stays in a scratch directory under /tmp.
  capture:outputs-root:
    cmds:
      - |
        work=$(mktemp -d /tmp/lz-outputs.XXXXXX)
        cp tests/fixtures/outputs/root/main.tf "$work/"
        /tcb/tofu -chdir="$work" init -input=false -no-color > /dev/null
        /tcb/tofu -chdir="$work" apply -auto-approve -input=false -no-color > /dev/null
        /tcb/tofu -chdir="$work" output -json

  # A stage's real plan (005 T022, T024, T028, T030, T032): its own unit tests on a scratch copy,
  # mocked provider, mirror-only init; stdout is the verbose JSON plan of one run (RUN, default
  # `published_outputs_match_the_schema`), one line. tests/fixtures/outputs/capture-stage-plan.sh
  # records it. The project stage is captured in both modes: adopt (the default run) and reference;
  # the runtime stage without a slot (the default run) and with one.
  capture:tenant-state-plan:
    cmds: [{task: capture-stage-plan, vars: {STAGE: tenant-state}}]
  capture:account-governance-plan:
    cmds: [{task: capture-stage-plan, vars: {STAGE: account-governance}}]
  capture:project-plan:
    cmds: [{task: capture-stage-plan, vars: {STAGE: project}}]
  capture:project-reference-plan:
    cmds: [{task: capture-stage-plan, vars: {STAGE: project, RUN: reference_published_outputs_with_both_toggles}}]
  capture:project-network-plan:
    cmds: [{task: capture-stage-plan, vars: {STAGE: project-network}}]
  capture:runtime-plan:
    cmds: [{task: capture-stage-plan, vars: {STAGE: runtime}}]
  capture:runtime-slot-plan:
    cmds: [{task: capture-stage-plan, vars: {STAGE: runtime, RUN: slot_blue_names_the_bucket}}]

  capture:p24-apply-json:
    dir: tests/fixtures/tofu-probes/p24-apply-json
    cmds:
      - /tcb/tofu init -input=false -no-color > /dev/null
      - /tcb/tofu apply -json -auto-approve -input=false

  capture:p17-terramate:
    dir: tests/fixtures/terramate/p17
    cmds:
      - |
        echo '### terramate version'
        /tcb/terramate version
        mkdir -p /tmp/lz-p17-control /tmp/lz-p17
        cp root-no-version.tm.hcl.seed /tmp/lz-p17-control/terramate.tm.hcl
        echo '### terramate list (control: root config without required_version, no git)'
        status=0; /tcb/terramate -C /tmp/lz-p17-control list 2>&1 || status=$?; echo "LZ_EXIT=$status"
        cp root.tm.hcl.seed /tmp/lz-p17/terramate.tm.hcl
        cp generate.tm.hcl.seed /tmp/lz-p17/lz_generate.tm.hcl
        echo '### terramate create --id lz-account --name account --tags lz-stage-account --no-generate stacks/z-account'
        status=0; /tcb/terramate -C /tmp/lz-p17 create --id lz-account --name account --tags lz-stage-account --no-generate stacks/z-account 2>&1 || status=$?; echo "LZ_EXIT=$status"
        echo '### terramate create --id lz-tenant-alpha --name tenant-alpha --tags lz-stage-tenant,lz-tenant-alpha --after tag:lz-stage-account --no-generate stacks/a-tenant-alpha'
        status=0; /tcb/terramate -C /tmp/lz-p17 create --id lz-tenant-alpha --name tenant-alpha --tags lz-stage-tenant,lz-tenant-alpha --after tag:lz-stage-account --no-generate stacks/a-tenant-alpha 2>&1 || status=$?; echo "LZ_EXIT=$status"
        echo '### terramate create --id lz-runtime-alpha --name runtime-alpha --tags lz-stage-runtime,lz-tenant-alpha --after tag:lz-stage-tenant:lz-tenant-alpha --no-generate stacks/0-runtime-alpha'
        status=0; /tcb/terramate -C /tmp/lz-p17 create --id lz-runtime-alpha --name runtime-alpha --tags lz-stage-runtime,lz-tenant-alpha --after tag:lz-stage-tenant:lz-tenant-alpha --no-generate stacks/0-runtime-alpha 2>&1 || status=$?; echo "LZ_EXIT=$status"
        echo '### terramate create --id lz-tenant-beta --name tenant-beta --tags lz-stage-tenant,lz-tenant-beta --after tag:lz-stage-runtime --no-generate stacks/1-tenant-beta'
        status=0; /tcb/terramate -C /tmp/lz-p17 create --id lz-tenant-beta --name tenant-beta --tags lz-stage-tenant,lz-tenant-beta --after tag:lz-stage-runtime --no-generate stacks/1-tenant-beta 2>&1 || status=$?; echo "LZ_EXIT=$status"
        for s in z-account a-tenant-alpha 0-runtime-alpha 1-tenant-beta; do echo "### cat stacks/$s/stack.tm.hcl"; cat "/tmp/lz-p17/stacks/$s/stack.tm.hcl"; done
        echo '### generated files before terramate generate'
        find /tmp/lz-p17/stacks -name '_lz_*' | sort
        echo '### terramate generate'
        status=0; /tcb/terramate -C /tmp/lz-p17 generate 2>&1 || status=$?; echo "LZ_EXIT=$status"
        for s in z-account a-tenant-alpha 0-runtime-alpha 1-tenant-beta; do echo "### cat stacks/$s/_lz_main.tf"; cat "/tmp/lz-p17/stacks/$s/_lz_main.tf"; done
        echo '### terramate list (lexical order)'
        status=0; /tcb/terramate -C /tmp/lz-p17 list 2>&1 || status=$?; echo "LZ_EXIT=$status"
        echo '### terramate list --run-order'
        status=0; /tcb/terramate -C /tmp/lz-p17 list --run-order 2>&1 || status=$?; echo "LZ_EXIT=$status"

  # Retained-resource guard plans (005 T063/T064, T070); tests/fixtures/tofu-probes/protect/
  # capture.sh records their stdout. Each prints exactly the pinned `tofu show -json` document of
  # one case of roots.sh; state and scratch roots stay in /tmp.
  capture:protect-create:
    cmds: [{task: capture-protect, vars: {CASE: create}}]
  capture:protect-noop:
    cmds: [{task: capture-protect, vars: {CASE: noop}}]
  capture:protect-update:
    cmds: [{task: capture-protect, vars: {CASE: update}}]
  capture:protect-unretained-replace:
    cmds: [{task: capture-protect, vars: {CASE: unretained-replace}}]
  capture:protect-removed-block:
    cmds: [{task: capture-protect, vars: {CASE: removed-block}}]
  capture:protect-org-change:
    cmds: [{task: capture-protect, vars: {CASE: org-change}}]
  capture:protect-create-before-destroy:
    cmds: [{task: capture-protect, vars: {CASE: create-before-destroy}}]
  capture:protect-tenant-removed:
    cmds: [{task: capture-protect, vars: {CASE: tenant-removed}}]
  capture:protect-project-replaced:
    cmds: [{task: capture-protect, vars: {CASE: project-replaced}}]
  capture:protect-forget:
    cmds: [{task: capture-protect, vars: {CASE: forget}}]
  capture:protect-module-removed:
    cmds: [{task: capture-protect, vars: {CASE: module-removed}}]
  capture:protect-two-replacements:
    cmds: [{task: capture-protect, vars: {CASE: two-replacements}}]
  capture:protect-region-removed:
    cmds: [{task: capture-protect, vars: {CASE: region-removed}}]
  capture:protect-replace-requested:
    cmds: [{task: capture-protect, vars: {CASE: replace-requested}}]
  capture:protect-moved-replace:
    cmds: [{task: capture-protect, vars: {CASE: moved-replace}}]
  capture:protect-moved-out:
    cmds: [{task: capture-protect, vars: {CASE: moved-out}}]
  capture:protect-moved-only:
    cmds: [{task: capture-protect, vars: {CASE: moved-only}}]
  capture:protect-state-not-plan:
    cmds: [{task: capture-protect, vars: {CASE: state-not-plan}}]

  capture-validate:
    internal: true
    dir: tests/check/fixtures/static/{{.CASE}}
    cmds:
      - /tcb/tofu init -backend=false -lockfile=readonly -input=false -no-color > /dev/null 2>&1 || true
      - status=0; /tcb/tofu validate -json -no-color || status=$?; echo "LZ_EXIT=$status" >&2

  capture-tflint:
    internal: true
    dir: tests/check/fixtures/static/{{.CASE}}
    cmds:
      - status=0; /tcb/tflint --config=/candidate/.tflint.hcl --format=json --no-color || status=$?; echo "LZ_EXIT=$status" >&2

  capture-protect:
    internal: true
    dir: tests/fixtures/tofu-probes/protect
    cmds:
      - sh roots.sh /tcb/tofu {{.CASE}}

  capture-stage-plan:
    internal: true
    cmds:
      - |
        set -e
        work=$(mktemp -d /tmp/lz-{{.STAGE}}.XXXXXX)
        trap 'rm -rf "$work"' EXIT
        cp -r modules components stages "$work/"
        find "$work" -name .terraform -type d -prune -exec rm -rf {} +
        dir="$work/stages/{{.STAGE}}"
        /tcb/tofu -chdir="$dir" init -backend=false -lockfile=readonly -input=false -no-color > /dev/null
        /tcb/tofu -chdir="$dir" test -json -verbose -no-color > "$work/test.jsonl"
        grep '"type":"test_plan"' "$work/test.jsonl" | grep '"@testrun":"{{.RUN | default "published_outputs_match_the_schema"}}"'

  capture-tofu:
    internal: true
    dir: tests/fixtures/tofu/modules/{{.CASE}}
    cmds:
      - /tcb/tofu init -backend=false -input=false -no-color > /dev/null
      - /tcb/tofu test -json
