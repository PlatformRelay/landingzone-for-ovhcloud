# Run every target through the installed entry:
#   lz-offline --candidate <absolute-checkout> -- task <target>
# verify:toolchain and test:offline-boundary are run by the entry's own trusted
# code; definitions for them here are never consulted, so a candidate cannot
# turn a qualification into a no-op.
version: '3'
silent: true

tasks:
  test:reports:
    desc: Report adapter, schema and JUnit view against the captured tofu streams (V002)
    cmds:
      - go -C tools test -count=1 ./internal/report ./cmd/json2junit

  test:traceability:
    desc: Trace rules, check registry and DoD evaluator (V003)
    cmds:
      - go -C tools test -count=1 ./internal/checks ./cmd/lz-check

  test:dependencies:
    desc: Layer, reference and changed-closure rules on their fixtures, then this repository's own module graph (V006)
    cmds:
      - go -C tools test -count=1 -run 'TestDependenc' ./internal/checks ./cmd/lz-check
      - go -C tools run ./cmd/lz-check -root .. deps

  test:runtime-image:
    desc: Reproducible OCI packing of the runtime bundle and launcher, and its refusals (V009)
    cmds:
      - go -C tools test -count=1 ./cmd/lz-pack ./internal/bundle/...

  test:static:
    desc: Real pinned fmt, init, validate and TFLint clauses on valid and broken fixtures (V006)
    cmds:
      - go -C tools test -count=1 -tags offlinetools -run 'TestStatic|TestLint' ./internal/checks ./cmd/lz-check

  lint:
    desc: 'Pinned fmt, init, validate and TFLint on one module directory, e.g. task lint -- modules/naming (V006)'
    cmds:
      - go -C tools run ./cmd/lz-check -root .. lint {{.CLI_ARGS}}

  check:specs:
    desc: Trace every spec 001 requirement and task through harness/checks.yaml (V003)
    cmds:
      - go -C tools run ./cmd/lz-check -root .. specs specs/001-offline-foundation

  dod:
    desc: 'Definition of done for a path, e.g. task dod -- modules/naming (V003)'
    cmds:
      - go -C tools run ./cmd/lz-check -root .. dod {{.CLI_ARGS}}

  # One target per report fixture case; tests/fixtures/tofu/capture.sh records
  # their stdout. Each prints exactly the pinned `tofu test -json` stream.
  capture:tofu-pass:
    cmds: [{task: capture-tofu, vars: {CASE: pass}}]
  capture:tofu-fail:
    cmds: [{task: capture-tofu, vars: {CASE: fail}}]
  capture:tofu-zero:
    cmds: [{task: capture-tofu, vars: {CASE: zero}}]
  capture:tofu-skip:
    cmds: [{task: capture-tofu, vars: {CASE: skip}}]
  capture:tofu-cleanup:
    cmds: [{task: capture-tofu, vars: {CASE: cleanup}}]

  # Report captures of the static clauses: stdout is exactly the pinned tool's
  # JSON report; stderr ends with the tool's exit status.
  capture:validate-valid:
    cmds: [{task: capture-validate, vars: {CASE: valid}}]
  capture:validate-malformed:
    cmds: [{task: capture-validate, vars: {CASE: malformed}}]
  capture:tflint-valid:
    cmds: [{task: capture-tflint, vars: {CASE: valid}}]
  capture:tflint-lint:
    cmds: [{task: capture-tflint, vars: {CASE: lint}}]
  capture:tflint-malformed:
    cmds: [{task: capture-tflint, vars: {CASE: malformed}}]

  capture-validate:
    internal: true
    dir: tests/check/fixtures/static/{{.CASE}}
    cmds:
      - /tcb/tofu init -backend=false -lockfile=readonly -input=false -no-color > /dev/null 2>&1 || true
      - status=0; /tcb/tofu validate -json -no-color || status=$?; echo "LZ_EXIT=$status" >&2

  capture-tflint:
    internal: true
    dir: tests/check/fixtures/static/{{.CASE}}
    cmds:
      - status=0; /tcb/tflint --config=/candidate/.tflint.hcl --format=json --no-color || status=$?; echo "LZ_EXIT=$status" >&2

  capture-tofu:
    internal: true
    dir: tests/fixtures/tofu/modules/{{.CASE}}
    cmds:
      - /tcb/tofu init -backend=false -input=false -no-color > /dev/null
      - /tcb/tofu test -json
